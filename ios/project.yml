name: Miracles
options:
  bundleIdPrefix: com.sageryza
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Miracles:
    type: application
    platform: iOS
    sources:
      - path: Miracles
        excludes:
          - PrivacyInfo.xcprivacy
      # The privacy manifest must ship inside the app bundle: named explicitly
      # as a resource so no XcodeGen version can leave it out.
      - path: Miracles/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sageryza.miracles
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Miracles
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Every background is a fixed cream: always light, never Dark Mode.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseFirestore
  MiraclesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MiraclesUITests
    dependencies:
      - target: Miracles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sageryza.miracles.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Miracles:
    build:
      targets:
        Miracles: all
        MiraclesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiraclesUITests
    archive:
      config: Release
