name: ASC review status
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle id to report on
        required: false
        default: com.sageryza.xi

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query App Store review state
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_BUNDLE_ID: ${{ inputs.bundle || 'com.sageryza.xi' }}
        run: python3 ci/asc_review_status.py
